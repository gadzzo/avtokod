<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Автокод</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header>
    <div>
      <div class="brand">АВТО<span>КОД</span></div>
      <div class="sub">коллекционируй автомобили</div>
    </div>
    <div class="money">₽ <b id="balance">2 500 000</b></div>
  </header>

  <div class="stats">
    <div>🚘 <b id="cars">0</b><small>авто</small></div>
    <div>⭐ <b id="level">1</b><small>уровень</small></div>
    <div>🔥 <b id="streak">0</b><small>серия</small></div>
  </div>

  <div class="tabs">
    <button class="active">Гараж</button>
    <button>Коллекция</button>
    <button>Рынок</button>
  </div>

  <section class="showcase">
    <div class="rarity" id="rarity">ЭПИЧЕСКИЙ</div>
    <div class="car-art" id="carArt">🚘</div>
    <div class="car-name" id="carName">BMW M4 Competition</div>
    <div class="specs">
      <span id="power">510 л.с.</span>
      <span id="year">2024</span>
      <span id="chance">Шанс 4,0%</span>
    </div>
    <div class="price" id="price">3 900 000 ₽</div>
  </section>

  <div class="hint" id="hint">Открой автомобиль и попробуй выбить редкость выше.</div>

  <button class="open" id="open">🎲 ОТКРЫТЬ АВТО <span>150 000 ₽</span></button>
  <button class="free" id="free">🎁 Ежедневное открытие</button>

  <div class="collection-title">
    <b>Последние находки</b><span id="count">0 / 50</span>
  </div>
  <div class="mini-grid" id="grid"></div>
</div>
<script src="app.js"></script>
</body>
</html>
